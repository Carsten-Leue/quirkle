<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qwirkle Punktetafel</title>
<style>
  /* ---------------------------------------------------------
     Built for the Kindle Paperwhite's old WebKit browser:
     - No CSS Grid, no Flexbox, no clamp(), no CSS variables.
     - Layout uses floats + display:table/table-cell (CSS2.1),
       both supported by very old browsers.
     - Sizing that needs to "fill the page" is computed in JS
       with plain px values instead of vh/clamp().
     - No ES6 in the JS: var only, no arrow functions,
       no template literals, no let/const.
  --------------------------------------------------------- */
  * {
    box-sizing: border-box;
    -webkit-box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    padding: 14px 12px 14px;
  }

  .clearfix:after {
    content: "";
    display: block;
    clear: both;
  }

  header {
    border-bottom: 3px solid #000;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }

  h1 {
    float: left;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0;
  }

  h1 .sub {
    font-family: Verdana, sans-serif;
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    margin-top: 2px;
  }

  #round {
    float: right;
    font-family: Verdana, sans-serif;
    font-size: 16px;
    padding-top: 8px;
  }

  .rules-note {
    font-family: Verdana, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    border: 2px dashed #000;
    padding: 8px 10px;
    margin-bottom: 12px;
  }

  /* ---- Tile-rack divider, six Qwirkle shapes as inline SVG ---- */
  .tilebar {
    text-align: center;
    padding: 6px 0 2px;
  }
  .tilebar svg { width: 18px; height: 18px; margin: 0 6px; }

  #players {
    border-top: 3px solid #000;
    padding-top: 12px;
    margin-top: 4px;
  }

  .player-wrap {
    float: left;
    padding: 0 6px 12px 6px;
    box-sizing: border-box;
    -webkit-box-sizing: border-box;
  }

  .player {
    border: 4px solid #000;
    padding: 10px 12px 12px;
    box-sizing: border-box;
    -webkit-box-sizing: border-box;
    overflow: hidden;
  }

  .player-head {
    margin-bottom: 6px;
  }

  .player-name {
    float: left;
    font-size: 24px;
    font-weight: 700;
    border: none;
    background: transparent;
    font-family: Georgia, serif;
    width: 60%;
    padding: 2px 0;
    border-bottom: 2px solid transparent;
  }
  .player-name:focus { outline: none; border-bottom: 2px solid #000; }

  .remove-player {
    float: right;
    font-family: Verdana, sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: #fff;
    border: 2px solid #000;
    padding: 7px 10px;
  }

  /* display:table/table-cell instead of flexbox, for vertical centering */
  .score-row {
    display: table;
    width: 100%;
    table-layout: fixed;
  }

  .score-display {
    display: table-cell;
    vertical-align: middle;
    border: 4px solid #000;
    font-weight: 700;
    text-align: center;
    font-family: Verdana, Geneva, sans-serif;
    line-height: 1;
  }

  .btn-col {
    display: table-cell;
    vertical-align: middle;
    width: 108px;
    padding-left: 8px;
  }

  button {
    font-family: Verdana, sans-serif;
    font-weight: bold;
    background: #fff;
    color: #000;
    border: 3px solid #000;
    cursor: pointer;
    -webkit-appearance: none;
  }

  button:active {
    background: #000;
    color: #fff;
  }

  .stepper {
    display: block;
    width: 100%;
    height: 53px;
    font-size: 26px;
    margin-bottom: 6px;
  }

  .quick-row {
    margin-top: 8px;
  }

  .quick-row button {
    float: left;
    width: 31%;
    margin-right: 3.5%;
    height: 53px;
    font-size: 18px;
  }

  .quick-row button.last {
    margin-right: 0;
  }

  .actions {
    margin-top: 16px;
  }

  .actions button {
    float: left;
    width: 48%;
    margin-right: 4%;
    height: 58px;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .actions button.last {
    margin-right: 0;
  }

  footer {
    clear: both;
    margin-top: 18px;
    font-family: Verdana, sans-serif;
    font-size: 12px;
    text-align: center;
    color: #000;
    border-top: 1px solid #000;
    padding-top: 8px;
  }
</style>
</head>
<body>

<header class="clearfix">
  <h1>Qwirkle<span class="sub">Punktetafel</span></h1>
  <div id="round"></div>
</header>

<div class="rules-note">
  Tippe <strong>+1 / -1</strong> für jeden in diesem Zug gelegten Stein. Nutze <strong>Qwirkle +6</strong>,
  wenn ein Spieler eine Reihe von 6 vervollständigt. Nutze <strong>Schluss +6</strong> einmal, für wer zuerst alle Steine loswird.
</div>

<div id="players" class="clearfix"></div>

<div class="actions clearfix">
  <button id="addPlayerBtn" class="">+ Spieler hinzufügen</button>
  <button id="newGameBtn" class="last">Neues Spiel</button>
</div>

<footer>Punktestände werden automatisch auf diesem Gerät gespeichert.</footer>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "qwirkle-scoreboard-v1";
  var MAX_PLAYERS = 6;

  var SHAPES = [
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#000" stroke-width="2.5"/></svg>',
    '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="#000" stroke-width="2.5"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="none" stroke="#000" stroke-width="2.5"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 1 L15 9 L23 12 L15 15 L12 23 L9 15 L1 12 L9 9 Z" fill="none" stroke="#000" stroke-width="2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M9 2h6v6h6v6h-6v6H9v-6H3V8h6z" fill="none" stroke="#000" stroke-width="2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 2 A5 5 0 1 1 11.9 2 M12 12 A5 5 0 1 1 3 12 M12 12 A5 5 0 1 1 21 12" fill="none" stroke="#000" stroke-width="2"/></svg>'
  ];

  function defaultState() {
    return {
      players: [
        { name: "Spieler 1", score: 0 },
        { name: "Spieler 2", score: 0 }
      ]
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed.players || !parsed.players.length) return defaultState();
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable, continue in-memory */ }
  }

  var state = load();

  var playersEl = document.getElementById("players");
  var roundEl = document.getElementById("round");
  var actionsEl = document.querySelector(".actions");
  var footerEl = document.querySelector("footer");

  var wrapEls = [];
  var scoreDisplayEls = [];

  function columnsFor(n) {
    if (n <= 1) return 1;
    if (n <= 4) return 2;
    return 3;
  }

  function render() {
    roundEl.textContent = state.players.length + " Spieler";

    playersEl.innerHTML = "";
    wrapEls = [];
    scoreDisplayEls = [];

    state.players.forEach(function (p, idx) {
      var wrap = document.createElement("div");
      wrap.className = "player-wrap";

      var card = document.createElement("div");
      card.className = "player";

      var head = document.createElement("div");
      head.className = "player-head clearfix";

      var nameInput = document.createElement("input");
      nameInput.className = "player-name";
      nameInput.value = p.name;
      nameInput.setAttribute("aria-label", "Spielername");
      nameInput.addEventListener("change", function () {
        state.players[idx].name = nameInput.value || ("Spieler " + (idx + 1));
        save();
      });

      head.appendChild(nameInput);

      if (state.players.length > 1) {
        var rm = document.createElement("button");
        rm.className = "remove-player";
        rm.textContent = "Entfernen";
        rm.addEventListener("click", function () {
          if (confirm((state.players[idx].name || "Diesen Spieler") + " entfernen?")) {
            state.players.splice(idx, 1);
            save();
            render();
          }
        });
        head.appendChild(rm);
      }

      card.appendChild(head);

      var scoreRow = document.createElement("div");
      scoreRow.className = "score-row";

      var display = document.createElement("div");
      display.className = "score-display";
      display.textContent = p.score;

      var btnCol = document.createElement("div");
      btnCol.className = "btn-col";

      var plus = document.createElement("button");
      plus.className = "stepper";
      plus.textContent = "+1";
      plus.addEventListener("click", function () {
        state.players[idx].score += 1;
        save();
        display.textContent = state.players[idx].score;
      });

      var minus = document.createElement("button");
      minus.className = "stepper";
      minus.textContent = "-1";
      minus.addEventListener("click", function () {
        state.players[idx].score = Math.max(0, state.players[idx].score - 1);
        save();
        display.textContent = state.players[idx].score;
      });

      btnCol.appendChild(plus);
      btnCol.appendChild(minus);

      scoreRow.appendChild(display);
      scoreRow.appendChild(btnCol);
      card.appendChild(scoreRow);

      var quickRow = document.createElement("div");
      quickRow.className = "quick-row clearfix";

      var plus3 = document.createElement("button");
      plus3.textContent = "+3";
      plus3.addEventListener("click", function () {
        state.players[idx].score += 3;
        save();
        display.textContent = state.players[idx].score;
      });

      var plusQwirkle = document.createElement("button");
      plusQwirkle.textContent = "Qwirkle +6";
      plusQwirkle.addEventListener("click", function () {
        state.players[idx].score += 6;
        save();
        display.textContent = state.players[idx].score;
      });

      var plusFinal = document.createElement("button");
      plusFinal.className = "last";
      plusFinal.textContent = "Schluss +6";
      plusFinal.addEventListener("click", function () {
        state.players[idx].score += 6;
        save();
        display.textContent = state.players[idx].score;
      });

      quickRow.appendChild(plus3);
      quickRow.appendChild(plusQwirkle);
      quickRow.appendChild(plusFinal);
      card.appendChild(quickRow);

      var tileDiv = document.createElement("div");
      tileDiv.className = "tilebar";
      tileDiv.innerHTML = SHAPES.join("");
      card.appendChild(tileDiv);

      wrap.appendChild(card);
      playersEl.appendChild(wrap);

      wrapEls.push(wrap);
      scoreDisplayEls.push(display);
    });

    layout();
  }

  // Compute pixel sizes so the board fills the screen, without
  // relying on CSS Grid/Flexbox/clamp() (unsupported on old
  // Kindle browsers). Plain px values set via inline style.
  function layout() {
    var n = state.players.length;
    var cols = columnsFor(n);
    var rows = Math.ceil(n / cols);

    var vh = window.innerHeight || document.documentElement.clientHeight || 600;
    var playersTop = playersEl.offsetTop;
    var actionsHeight = actionsEl ? actionsEl.offsetHeight : 50;
    var footerHeight = footerEl ? footerEl.offsetHeight : 30;
    var bottomPadding = 40;

    var available = vh - playersTop - actionsHeight - footerHeight - bottomPadding;
    if (available < 220) available = 220;

    var rowHeight = Math.floor(available / rows) - 12;
    if (rowHeight < 140) rowHeight = 140;

    var colWidth = Math.floor(100 / cols);

    var i;
    for (i = 0; i < wrapEls.length; i++) {
      wrapEls[i].style.width = colWidth + "%";
      wrapEls[i].style.height = rowHeight + "px";
    }

    var scoreHeight = Math.floor(rowHeight * 0.44);
    if (scoreHeight < 56) scoreHeight = 56;

    var fontSize = Math.floor(scoreHeight * 0.7);
    if (fontSize > 104) fontSize = 104;
    if (fontSize < 27) fontSize = 27;

    for (i = 0; i < scoreDisplayEls.length; i++) {
      scoreDisplayEls[i].style.height = scoreHeight + "px";
      scoreDisplayEls[i].style.fontSize = fontSize + "px";
    }
  }

  document.getElementById("addPlayerBtn").addEventListener("click", function () {
    if (state.players.length >= MAX_PLAYERS) {
      alert("Maximal " + MAX_PLAYERS + " Spieler.");
      return;
    }
    state.players.push({ name: "Spieler " + (state.players.length + 1), score: 0 });
    save();
    render();
  });

  document.getElementById("newGameBtn").addEventListener("click", function () {
    if (confirm("Neues Spiel starten? Alle Punktestände werden zurückgesetzt.")) {
      var names = state.players.map(function (p) { return p.name; });
      state = defaultState();
      state.players = names.map(function (n) { return { name: n, score: 0 }; });
      save();
      render();
    }
  });

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () {
    setTimeout(layout, 300);
  });

  render();
})();
</script>

</body>
</html>
